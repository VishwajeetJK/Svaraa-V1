name: ci
on:
  push:
  pull_request:
jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install
      - run: pnpm test
      - run: pnpm --filter @svaraa/web build
      - run: pnpm --filter @svaraa/control-plane build
      - run: pnpm --filter @svaraa/tenant build
      - run: pnpm --filter @svaraa/web exec playwright install chromium
      - name: e2e smoke
        run: pnpm --filter @svaraa/web test:e2e
        env:
          CI: true

